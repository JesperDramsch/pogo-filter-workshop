# Temporary: checks that a failed job's outputs reach a dependent job.
# Removed in the next commit.
name: tmp outputs probe
on: push
permissions: {}
jobs:
  a:
    runs-on: ubuntu-latest
    outputs:
      x: ${{ steps.s.outputs.x }}
    steps:
      - id: s
        run: echo "x=hello" >> "$GITHUB_OUTPUT"
      - run: exit 1
  b:
    needs: a
    if: ${{ !cancelled() && needs.a.outputs.x == 'hello' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          X: ${{ needs.a.outputs.x }}
          RESULT: ${{ needs.a.result }}
        run: echo "a.result=$RESULT a.outputs.x=$X"
