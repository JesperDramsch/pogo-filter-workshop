name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:fixtures
      - run: npm run test:migration
      - run: npm run test:buddy
      - run: npm run test:regionals
      - run: npm run test:lucky
      - run: npm run build
