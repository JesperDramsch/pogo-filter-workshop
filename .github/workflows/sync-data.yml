name: Sync data

# One job for every upstream snapshot. These used to be ten workflows, each
# spinning up its own runner, checkout and `npm ci` to run a fetch of a few
# seconds, and each data commit pushed separately, so Tests, CodeQL and Deploy
# ran once per snapshot that moved. Here the snapshots that moved go out as one
# commit and one push. Translations are the exception: they open a PR rather
# than pushing, so they run as a second job alongside (see the bottom).
#
# The fetches run one after another on purpose. Six of them read the same
# 19 MB game master, and scripts/lib/game-master.mjs caches it on disk keyed by
# batch, so in sequence only the first one downloads it. Run in parallel, they
# would all miss the cache and download it at once.

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  # Run workflow → tick the parts to sync, e.g. the one that failed this
  # morning. Nothing ticked syncs everything, like the schedule does. The
  # reference regeneration, validation and commit always run, so a partial
  # run is held to the same checks as a full one.
  workflow_dispatch:
    inputs:
      raids:
        description: Raid + max-battle bosses
        type: boolean
      rocket-lineups:
        description: Team Rocket lineups
        type: boolean
      rocket-quotes:
        description: Team Rocket grunt quotes
        type: boolean
      pvp:
        description: PvP rankings
        type: boolean
      meta:
        description: Raid-attacker + shadow-keeper rankings
        type: boolean
      species-meta:
        description: Species meta (friend-collect pools)
        type: boolean
      events:
        description: Wild-spawn events
        type: boolean
      regional-forms:
        description: Regional-form catalog
        type: boolean
      game-master-watch:
        description: Game master move-stat watch
        type: boolean
      translations:
        description: Translations (opens a PR)
        type: boolean

# Read-only unless a job says otherwise. The sync job pushes with the app
# token, not github.token, so it needs nothing more; only the translations
# job writes, and only to open its PR.
permissions:
  contents: read

# A manual dispatch must not race the scheduled run to the same push.
concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    # Everything except a manual run that ticked translations and nothing
    # else, which is the translations job's alone.
    if: github.event_name != 'workflow_dispatch' || !inputs.translations || inputs.raids || inputs.rocket-lineups || inputs.rocket-quotes || inputs.pvp || inputs.meta || inputs.species-meta || inputs.events || inputs.regional-forms || inputs.game-master-watch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Scheduled runs, and a manual run with nothing ticked, sync everything.
      SYNC_ALL: ${{ github.event_name != 'workflow_dispatch' || !(inputs.raids || inputs.rocket-lineups || inputs.rocket-quotes || inputs.pvp || inputs.meta || inputs.species-meta || inputs.events || inputs.regional-forms || inputs.game-master-watch) }}
    steps:
      # No token, and nothing persisted. Checkout writes the token it is given
      # into the git config, where every later step can read it, and every
      # step from npm ci to the validation runs code from npm dependencies.
      # github.token is enough to fetch; the push mints its own token below.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The commit the job summary compares every snapshot against. Normally
      # GITHUB_SHA; recorded here because a rebase before the push moves HEAD.
      - name: Record the commit the sync starts from
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Make a directory for the step logs
        run: mkdir -p "$RUNNER_TEMP/sync"

      # ── Fetch ────────────────────────────────────────────────────────────
      # Every fetch exits 1 on real failure (fetch error, empty or shrunken
      # upstream, a sanity assertion tripping) and writes nothing when it does,
      # so one broken upstream must not hold back the others: each step carries
      # on, and the last step turns the run red at the end. A red run + GitHub
      # notification is the only intervention the user wants.
      #
      # Each fetch is cut off at 2 minutes; a normal one takes about a second,
      # the first 19 MB game-master download a few. No fetcher sets a request
      # timeout and Node's fetch waits up to 300 s for headers, so one hung
      # upstream could otherwise run the job into its own timeout before
      # "Commit + push", losing every other source's update that day. A step
      # that times out reports outcome=failure, so the run still names it. The
      # job allows 9 × 2 minutes plus setup and validation. No retries: the
      # failures in the run history are deterministic, not transient.
      #
      # Each fetch also tees its output to $RUNNER_TEMP/sync/<step id>.log, for
      # the job summary: its ⚠ lines and a failed step's last ✗ line. `shell:
      # bash` is what keeps that honest: it adds pipefail, so the step fails
      # when the fetch does, not only when tee does. The default shell is
      # `bash -e` without pipefail.
      #
      # Deliberately does NOT regenerate the fixture: the snapshot pins only
      # config-derived filters, and the data-derived ones these feed are covered
      # by property checks in scripts/check-data-filters.mjs. See the split in
      # scripts/lib/fixture.mjs before adding a regeneration step back.
      - name: Fetch raid + max-battle bosses from lily-dex-api
        id: raids
        if: env.SYNC_ALL == 'true' || inputs.raids
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: npm run fetch-raid-bosses 2>&1 | tee "$RUNNER_TEMP/sync/raids.log"
      # A failed takeover read exits non-zero AFTER writing the ScrapedDuck
      # snapshot. That snapshot is still committed below; the run goes red at
      # the end.
      - name: Fetch Team Rocket lineups from ScrapedDuck (+ LeekDuck during a takeover) + lily-dex-api types
        id: rocket-lineups
        if: env.SYNC_ALL == 'true' || inputs.rocket-lineups
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: npm run fetch-rocket-lineups 2>&1 | tee "$RUNNER_TEMP/sync/rocket-lineups.log"
      - name: Fetch Team Rocket grunt quotes from holoholo-text
        id: rocket-quotes
        if: env.SYNC_ALL == 'true' || inputs.rocket-quotes
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: npm run fetch-rocket-grunt-quotes 2>&1 | tee "$RUNNER_TEMP/sync/rocket-quotes.log"
      - name: Fetch Great / Ultra / Master + cup rankings from PvPoke (lily-dex fallback)
        id: pvp
        if: env.SYNC_ALL == 'true' || inputs.pvp
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: npm run fetch-pvp-rankings 2>&1 | tee "$RUNNER_TEMP/sync/pvp.log"
      - name: Derive raid-attacker rankings from the game master (alexelgt, PokeMiners fallback)
        id: meta
        if: env.SYNC_ALL == 'true' || inputs.meta
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: npm run fetch-meta-rankings 2>&1 | tee "$RUNNER_TEMP/sync/meta.log"
      # The friend-collect packs read this snapshot at build time.
      - name: Derive species meta from the game master + PvPoke roster
        id: species-meta
        if: env.SYNC_ALL == 'true' || inputs.species-meta
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: npm run fetch-species-meta 2>&1 | tee "$RUNNER_TEMP/sync/species-meta.log"
      # Event spawn filters are time-windowed and excluded from the fixture
      # snapshot (like event raids).
      - name: Fetch wild-spawn events from leak-duck
        id: events
        if: env.SYNC_ALL == 'true' || inputs.events
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: npm run fetch-events 2>&1 | tee "$RUNNER_TEMP/sync/events.log"
      # Self-validates known forms, so a changed upstream shape fails here.
      - name: Derive the regional-form catalog from the game master
        id: regional-forms
        if: env.SYNC_ALL == 'true' || inputs.regional-forms
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: npm run fetch-regional-forms 2>&1 | tee "$RUNNER_TEMP/sync/regional-forms.log"
      # After the PvP fetch, so a rebalance and the rankings that respond to it
      # land in the same reference regeneration below.
      - name: Snapshot PvP move stats and probe the PokeMiners mirror
        id: game-master-watch
        if: env.SYNC_ALL == 'true' || inputs.game-master-watch
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: npm run fetch-game-master-watch 2>&1 | tee "$RUNNER_TEMP/sync/game-master-watch.log"

      # ── Regenerate + validate ────────────────────────────────────────────
      # The skill's meta reference is generated from the snapshots we just
      # wrote, in THIS job, because check-meta-reference.mjs (M1) fails CI when
      # the two drift. That is the whole guarantee: a synced snapshot can never
      # leave a refrozen tier list behind it. It reads both pvp-rankings.json
      # and game-master-watch.json (its "Move rebalance watch" section), so it
      # runs once, after both fetches.
      - name: Regenerate the skill-facing PvP meta reference
        run: npm run generate-pvp-meta-reference

      # Fail CLOSED. This job pushes straight to a protected branch, so without
      # a validation step here any generation that breaks M1-M6 lands on main
      # first and is only discovered when test.yml fires on the resulting push,
      # leaving main red with no automated revert. Running the same checks
      # before the commit turns that into a failed sync instead, and holds back
      # the whole push: check-data-filters covers raids, Rocket and PvP alike.
      - name: Validate the snapshots and the regenerated reference
        id: validate
        shell: bash
        run: |
          npm run test:datafilters 2>&1 | tee "$RUNNER_TEMP/sync/validate.log"
          npm run test:metaref 2>&1 | tee -a "$RUNNER_TEMP/sync/validate.log"

      # ── Commit + push ────────────────────────────────────────────────────
      # The commit is made before the app token exists. Building its message
      # runs vite-node, which starts Vite and loads its plugins, PostCSS,
      # Tailwind and the rest of the dependency tree, so it must not run in a
      # process that has the token in its environment.
      - name: Commit the snapshots that moved
        id: local-commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One body line per part that moved, so the commit still names every
          # source. Only parts whose content changed reach the subject; a part
          # where nothing but an upstream batch stamp moved is still committed
          # (check-meta-rankings needs the roster stamp to advance) and reads
          # "- <scope>: provenance only (<stamp>)". The game-master line names
          # each new history entry, which IS the rebalance notification. The
          # parts, their files and their wording are the PARTS table in
          # scripts/sync-summary.mjs, which the job summary reads too.
          npx vite-node scripts/sync-summary.mjs classify --base HEAD --out "$RUNNER_TEMP/sync"
          mapfile -t paths < "$RUNNER_TEMP/sync/commit-paths.txt"
          if [ ${#paths[@]} -eq 0 ]; then
            echo "No snapshot changes — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -- "${paths[@]}"
          git commit -F "$RUNNER_TEMP/sync/commit-message.txt"
          git log -1 --stat
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Push as the Pushologist GitHub App so the commit can bypass the
      # branch protection on main (GITHUB_TOKEN pushes are rejected there).
      # That bypass makes this token the most valuable secret in the repo: a
      # push to main deploys the site. So it is minted only when there is a
      # commit to push, after the last step that runs dependency code, scoped
      # to the one permission a push needs, and handed to the push step
      # alone, which runs nothing but git. The job summary step after it runs
      # vite-node again but never sees the token.
      #
      # This narrows the exposure; it is not a hard boundary. APP_SECRET is on
      # this runner from the start of the job, where a compromised dependency
      # that scrapes the runner's memory could still reach it. Only a push
      # job of its own, with no npm code in it, would close that.
      - name: Mint Pushologist app token
        id: app-token
        if: steps.local-commit.outputs.changed == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          permission-contents: write
      - name: Push the data commit
        id: commit
        if: steps.local-commit.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # main can move while the fetches run. The commit only touches
          # snapshot files nobody edits by hand, so a rebase onto the new tip
          # is clean, and test.yml still runs on the result. The pull needs no
          # token: the repo is public.
          #
          # The app token goes into the URL of each push and nowhere else, so
          # it is never written to the git config. The token action registers
          # it as a secret, so the runner masks it in the log.
          remote="https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" "HEAD:$GITHUB_REF_NAME" || {
            git pull --rebase origin "$GITHUB_REF_NAME" &&
              git push "$remote" "HEAD:$GITHUB_REF_NAME"
          }
          # After the push: a rebase gives the commit a new sha.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ── Report ───────────────────────────────────────────────────────────
      # The job summary: a row per part, what moved in PvP, events, raids and
      # the move-stat watch, and the folded warnings. It runs first and with
      # `|| true`, because it is a report and must never be what turns a run
      # red. It compares every snapshot with the commit the job started from,
      # so it reads the same after a push as when validation held one back.
      - name: Write the job summary; fail if any fetch failed
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          VALIDATE: ${{ steps.validate.outcome }}
          COMMIT: ${{ steps.local-commit.outcome }}
          # No token means no push, so a failed mint reads as a failed push.
          PUSH: ${{ steps.app-token.outcome == 'failure' && 'failure' || steps.commit.outcome }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          INPUTS: ${{ toJSON(inputs) }}
          OUTCOMES: >-
            raids=${{ steps.raids.outcome }}
            rocket-lineups=${{ steps.rocket-lineups.outcome }}
            rocket-quotes=${{ steps.rocket-quotes.outcome }}
            pvp=${{ steps.pvp.outcome }}
            meta=${{ steps.meta.outcome }}
            species-meta=${{ steps.species-meta.outcome }}
            events=${{ steps.events.outcome }}
            regional-forms=${{ steps.regional-forms.outcome }}
            game-master-watch=${{ steps.game-master-watch.outcome }}
        run: |
          npx vite-node scripts/sync-summary.mjs render --base "${BASE_SHA:-$GITHUB_SHA}" --logs "$RUNNER_TEMP/sync" >> "$GITHUB_STEP_SUMMARY" || true

          failed=$(tr ' ' '\n' <<<"$OUTCOMES" | grep '=failure$' | cut -d= -f1 || true)
          if [ -n "$failed" ]; then
            echo "These fetches failed (see their step logs):"
            while read -r step; do echo "  - $step"; done <<<"$failed"
            exit 1
          fi
          echo "All fetches succeeded."

  # Translations open a PR instead of pushing to main, so they never need the
  # app token. They run here, in parallel and on github.token alone, so the
  # third-party PR action never shares a runner with APP_SECRET, and the sync
  # job never has to reset its checkout to keep unpushed data out of the PR.
  translations:
    # Scheduled runs, a manual run with nothing ticked, and a manual run
    # that ticked translations.
    if: github.event_name != 'workflow_dispatch' || inputs.translations || !(inputs.raids || inputs.rocket-lineups || inputs.rocket-quotes || inputs.pvp || inputs.meta || inputs.species-meta || inputs.events || inputs.regional-forms || inputs.game-master-watch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # No continue-on-error: this job does one thing, so a red job is the
      # alert.
      - name: Fetch translations from holoholo-text
        id: fetch
        timeout-minutes: 2
        run: npm run fetch-translations
      # The export supplies the in-game keywords that go straight into
      # generated filters (a corrected DE word for "shiny" changes the trash
      # string), so the snapshot has to move with the locales. It must also be
      # listed in add-paths below, or the PR this opens fails check-fixtures
      # with no way to fix it from inside the PR.
      - name: Regenerate fixture snapshot
        run: npm run fixtures:update
      - name: Open PR if locale files changed
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          # The PR keeps going out as github-actions, as it did when this was
          # its own workflow.
          token: ${{ github.token }}
          commit-message: "chore(i18n): sync translations from holoholo-text"
          branch: chore/sync-translations
          delete-branch: true
          title: "chore(i18n): sync translations from holoholo-text"
          body: |
            Automated translation sync from sora10pls/holoholo-text (Niantic's localized text export).

            Generated by `.github/workflows/sync-data.yml` running
            `npm run fetch-translations`.

            Review `src/locales/_meta.json` for warnings (truncation, mojibake).

            CI on bot-opened PRs waits for approval: Checks → Approve and run. Update branch first if main has moved, as the required checks are strict.
          add-paths: |
            src/locales/**
            src/__fixtures__/default-filter-output.json
      # create-pull-request reports created, updated or closed, and nothing
      # (or "none", depending on the version) when the locales did not move.
      - name: Summarise
        if: always()
        env:
          FETCH: ${{ steps.fetch.outcome }}
          CPR: ${{ steps.cpr.outcome }}
          PR_OP: ${{ steps.cpr.outputs.pull-request-operation }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          case "$FETCH/$CPR/$PR_OP" in
            success/success/created | success/success/updated) line="PR [#$PR_NUMBER]($PR_URL) $PR_OP" ;;
            success/success/closed) line="PR [#$PR_NUMBER]($PR_URL) closed, the locales match main again" ;;
            success/success/*) line="no locale change, no PR" ;;
            failure/*) line="fetch failed, no PR (see its step log)" ;;
            *) line="no PR, a step failed (see the step logs)" ;;
          esac
          echo "## Translations · $line" >> "$GITHUB_STEP_SUMMARY"
