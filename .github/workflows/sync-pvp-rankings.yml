name: Sync PvP rankings

on:
  schedule:
    - cron: "29 8 * * *" # daily at 08:29 UTC (offset from other syncs)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Push as the Pushologist GitHub App so the commit can bypass the
      # branch protection on main (GITHUB_TOKEN pushes are rejected there).
      - name: Mint Pushologist app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch Great / Ultra / Master + cup rankings from PvPoke (lily-dex fallback)
        run: npm run fetch-pvp-rankings
      # The skill's meta reference is generated from the snapshot we just wrote, in
      # THIS job, because check-meta-reference.mjs (M1) fails CI when the two drift.
      # That is the whole guarantee: a synced snapshot can never leave a refrozen
      # tier list behind it.
      - name: Regenerate the skill-facing PvP meta reference
        run: npm run generate-pvp-meta-reference
        # Deliberately does NOT regenerate the fixture: the snapshot pins only
        # config-derived filters, and the data-derived ones this feeds are covered
        # by property checks in scripts/check-data-filters.mjs. See the split in
        # scripts/lib/fixture.mjs before adding a regeneration step back.

      # Fail CLOSED. This job pushes straight to a protected branch, so without a
      # validation step here any generation that breaks M1-M6 lands on main first
      # and is only discovered when test.yml fires on the resulting push — leaving
      # main red with no automated revert. Running the same checks before the
      # commit turns that into a failed sync instead.
      - name: Validate the snapshot and the regenerated reference
        run: |
          npm run test:datafilters
          npm run test:metaref
      - name: Commit + push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PATHS="src/data/pvp-rankings.json skills/pokemon-go-filters/references/META.md skills/pokemon-go-filters/references/pvp-meta.json"
          if git diff --quiet -- $PATHS; then
            echo "No PvP ranking changes — skipping commit."
            exit 0
          fi
          # Name the upstream the snapshot actually came from. The fetcher falls
          # back to lily-dex whenever PvPoke is unreachable, and that snapshot is
          # materially different (no speciesId, score or forms — the reference's
          # "Ranked form" and "Score" columns collapse to "—"). A message that
          # always said "from PvPoke" misattributed the provenance in the git log,
          # which is the trail CLAUDE.md points at.
          SOURCE=$(node -p "require('./src/data/pvp-rankings.json').source")
          git add $PATHS
          git commit -m "chore(pvp): sync ranking snapshot from ${SOURCE}"
          git push
