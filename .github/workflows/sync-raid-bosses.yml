name: Sync raid bosses

on:
  schedule:
    - cron: "43 7 * * *" # daily at 07:43 UTC (offset from translation sync)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Push as the Pushologist GitHub App so the commit can bypass the
      # branch protection on main (GITHUB_TOKEN pushes are rejected there).
      - name: Mint Pushologist app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Both steps below exit 1 on real failure (fetch error, empty upstream
      # response). A failed run shows up as a red workflow + GitHub
      # notification, which is the only intervention the user wants.
      - name: Fetch raid + max-battle bosses from lily-dex-api
        run: npm run fetch-raid-bosses
      # Deliberately does NOT regenerate the fixture: the snapshot pins only
      # config-derived filters, and the data-derived ones this feeds are covered
      # by property checks in scripts/check-data-filters.mjs. See the split in
      # scripts/lib/fixture.mjs before adding a regeneration step back.
      - name: Commit + push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/raid-bosses.json; then
            echo "No boss changes — skipping commit."
            exit 0
          fi
          git add src/data/raid-bosses.json
          git commit -m "chore(raids): sync boss snapshot from lily-dex-api"
          git push
